[build]
  command = "npm run build"
  publish = "build"

# React Router (client-side routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  REACT_APP_WAITLIST_MODE = "true"

# Google Sign-In popup needs to read window.closed (avoids COOP console noise).
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
